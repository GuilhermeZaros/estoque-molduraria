<script>
  // Navegação em 2 níveis: grupos no topo + sub-abas (sem reload).
  var SUBABA_ATIVA = {}; // lembra a última sub-aba aberta de cada grupo

  function mostrarAba(id) {
    document.querySelectorAll('.aba').forEach(function (s) {
      s.classList.toggle('ativa', s.id === id);
    });
    if (id === 'financeiro') { carregarFinanceiro(); carregarRelatorios(); carregarSaldos(); }
    if (id === 'of-producao') carregarOficinaProducao();
    if (id === 'of-prontos') carregarOficinaProntos();
    if (id === 'of-historico') carregarOficinaHistorico();
  }

  function selecionarSub(grupo, aba) {
    SUBABA_ATIVA[grupo] = aba;
    var sg = document.querySelector('#subnav .subgrupo[data-grupo="' + grupo + '"]');
    if (sg) sg.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('ativo', b.dataset.aba === aba);
    });
    mostrarAba(aba);
  }

  function abrirGrupo(grupo) {
    document.querySelectorAll('#grupos button').forEach(function (b) {
      b.classList.toggle('ativo', b.dataset.grupo === grupo);
    });
    var sg = document.querySelector('#subnav .subgrupo[data-grupo="' + grupo + '"]');
    document.querySelectorAll('#subnav .subgrupo').forEach(function (s) {
      s.classList.toggle('ativa', s === sg);
    });
    document.getElementById('subnav').classList.toggle('mostrar', !!sg);

    if (sg) {
      // escolhe a sub-aba lembrada, mas só se estiver visível pro papel atual; senão a 1ª visível
      var alvo = SUBABA_ATIVA[grupo];
      var btnLembrada = alvo ? sg.querySelector('button[data-aba="' + alvo + '"]') : null;
      if (!btnLembrada || btnLembrada.hidden) {
        var primeiro = sg.querySelector('button:not([hidden])') || sg.querySelector('button');
        alvo = primeiro.dataset.aba;
      }
      selecionarSub(grupo, alvo);
    } else {
      var btn = document.querySelector('#grupos button[data-grupo="' + grupo + '"]');
      mostrarAba(btn.dataset.aba); // grupo-folha: vai direto pra seção
    }
  }

  document.getElementById('grupos').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (btn) abrirGrupo(btn.dataset.grupo);
  });

  document.getElementById('subnav').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (!btn) return;
    var sg = btn.closest('.subgrupo');
    selecionarSub(sg.dataset.grupo, btn.dataset.aba);
  });

  function brl(v) {
    return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }
  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  // ---- Login / sessão ----
  var TOKEN = localStorage.getItem('vera_token') || '';
  var NOME = localStorage.getItem('vera_nome') || '';
  var PAPEIS = (localStorage.getItem('vera_papeis') || '').split(',').filter(Boolean);
  var APP_INICIADO = false;

  function temGestaoJS(p) { return p.indexOf('atendimento') !== -1 || p.indexOf('dono') !== -1; }
  function soOficinaJS(p) { return p.indexOf('oficina') !== -1 && !temGestaoJS(p); }

  // Esconde grupos/sub-abas conforme o papel. Só-oficina vê apenas Oficina → Em produção.
  function aplicarPapeis() {
    var so = soOficinaJS(PAPEIS);
    document.querySelectorAll('#grupos button').forEach(function (b) {
      b.hidden = so && b.dataset.grupo !== 'oficina';
    });
    document.querySelectorAll('#subnav .subgrupo[data-grupo="oficina"] button').forEach(function (b) {
      b.hidden = so && b.dataset.aba !== 'of-producao';
    });
  }

  function mostrarLogin() {
    document.body.classList.remove('logado');
    var s = document.getElementById('login-senha'); if (s) s.value = '';
  }
  function entrarNoApp() {
    document.body.classList.add('logado');
    var elNome = document.getElementById('usuario-nome');
    if (elNome) elNome.textContent = NOME ? ('Olá, ' + NOME) : '';
    iniciarApp();
  }
  function iniciarApp() {
    if (APP_INICIADO) return;
    APP_INICIADO = true;
    aplicarPapeis();
    if (soOficinaJS(PAPEIS)) { abrirGrupo('oficina'); return; } // só-oficina: direto pra fila
    carregarDashboard();
    carregarProdutos();
    carregarFinanceiroConfig();
  }
  function sairLocal() {
    TOKEN = ''; NOME = ''; PAPEIS = []; APP_INICIADO = false;
    localStorage.removeItem('vera_token');
    localStorage.removeItem('vera_nome');
    localStorage.removeItem('vera_papeis');
    mostrarLogin();
  }
  function erroEhSessao(err) {
    return err && /sess[aã]o|acesso restrito/i.test(String(err.message || ''));
  }

  document.getElementById('form-login').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
    mostrarMsg('Entrando…', true, 'login-msg');
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        if (r && r.ok) {
          TOKEN = r.token; NOME = r.nome || '';
          PAPEIS = r.papeis || [];
          localStorage.setItem('vera_token', TOKEN);
          localStorage.setItem('vera_nome', NOME);
          localStorage.setItem('vera_papeis', PAPEIS.join(','));
          document.getElementById('login-msg').className = 'msg';
          entrarNoApp();
        } else {
          mostrarMsg((r && r.erro) || 'Não foi possível entrar.', false, 'login-msg');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; mostrarMsg('Não deu: ' + (err && err.message), false, 'login-msg');
      })
      .autenticar(document.getElementById('login-email').value, document.getElementById('login-senha').value);
  });

  document.getElementById('btn-sair').addEventListener('click', function () {
    if (TOKEN) google.script.run.sair(TOKEN);
    sairLocal();
  });

  function renderDashboard(d) {
    if (!d) {
      document.getElementById('cards').innerHTML =
        '<span class="vazio">Não consegui carregar o resumo. Atualize a página (Ctrl+Shift+R).</span>';
      return;
    }
    var t = d.totais || {};
    document.getElementById('cards').innerHTML = [
      ['Molduras', t.moldura || 0], ['Vidros', t.vidro || 0],
      ['Chapas', t.chapa || 0], ['Espelhos', t.espelho || 0],
      ['Valor do estoque', brl(d.valor_estoque)], ['Vendas registradas', d.num_movimentacoes_venda || 0]
    ].map(function (c) {
      return '<div class="card"><div class="rotulo">' + c[0] + '</div><div class="valor">' + c[1] + '</div></div>';
    }).join('');

    var baixo = d.estoque_baixo || [];
    document.getElementById('estoque-baixo').innerHTML = baixo.length
      ? '<table><thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th></tr></thead><tbody>' +
        baixo.map(function (i) {
          return '<tr><td>' + escapar(i.nome) + ' <span class="pill baixo">baixo</span></td><td>' +
            escapar(i.categoria) + '</td><td>' + i.estoque + ' / ' + i.minimo + ' ' + escapar(i.unidade) + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="vazio">Tudo acima do mínimo 👍</p>';

    var ult = d.ultimas_movimentacoes || [];
    document.getElementById('ultimas').innerHTML = ult.length
      ? '<table><thead><tr><th>Quando</th><th>Tipo</th><th>Produto</th><th>Qtd</th><th>Valor</th></tr></thead><tbody>' +
        ult.map(function (m) {
          return '<tr><td>' + escapar(m.data_hora) + '</td><td>' + escapar(m.tipo) + '</td><td>' +
            escapar(m.produto) + '</td><td>' + escapar(m.quantidade) + ' ' + escapar(m.unidade) +
            '</td><td>' + (m.valor ? brl(m.valor) : '—') + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="vazio">Sem movimentações ainda.</p>';
  }

  function carregarDashboard() {
    google.script.run
      .withSuccessHandler(renderDashboard)
      .withFailureHandler(function (err) {
        document.getElementById('cards').innerHTML =
          '<span class="vazio">Erro ao carregar: ' + escapar(err && err.message) + '</span>';
      })
      .dashboardResumo();
  }

  var PRODUTOS = [];

  function opcoes(itens, placeholder) {
    var html = placeholder ? '<option value="">' + placeholder + '</option>' : '';
    return html + itens.map(function (p) {
      var rotulo = escapar(p.nome) + ' (' + p.codigo + ') · ' + p.estoque + p.unidade +
                   ' · R$ ' + p.preco + '/' + p.unidade +
                   (p.disponivel && p.estoque > 0 ? '' : ' ⚠️');
      return '<option value="' + escapar(p.codigo) + '">' + rotulo + '</option>';
    }).join('');
  }

  function filtrar(lista, query) {
    var q = (query || '').toLowerCase().trim();
    if (!q) return lista;
    return lista.filter(function (p) {
      return (p.nome + ' ' + p.codigo + ' ' + (p.marca || '')).toLowerCase().indexOf(q) >= 0;
    });
  }

  function preencherSelects() {
    var por = function (cat) { return PRODUTOS.filter(function (p) { return p.categoria === cat; }); };
    document.getElementById('q-moldura').innerHTML = opcoes(por('moldura'), '— escolha —');
    document.getElementById('s-moldura').innerHTML = opcoes(por('moldura'), '— escolha —');
    document.getElementById('q-vidro').innerHTML   = opcoes(por('vidro'),   '— sem vidro —');
    document.getElementById('q-chapa').innerHTML   = opcoes(por('chapa'),   '— sem chapa —');
    document.getElementById('q-espelho').innerHTML = opcoes(por('espelho'), '— sem espelho —');
    document.getElementById('a-produto').innerHTML = opcoes(PRODUTOS, '— escolha —');
    document.getElementById('e-produto').innerHTML = opcoes(PRODUTOS, '— escolha —');
  }

  function carregarProdutos() {
    google.script.run
      .withSuccessHandler(function (lista) { PRODUTOS = lista || []; preencherSelects(); renderConsulta(''); preencherSelectEditar(''); })
      .withFailureHandler(function (err) { console.error('Erro ao carregar produtos:', err && err.message); })
      .listarProdutos();
  }

  // Mostra um recado numa área (.msg) específica. À prova de null.
  function mostrarMsg(texto, ok, elId) {
    var el = elId ? document.getElementById(elId) : null;
    if (!el) { if (!ok) console.error(texto); return; }
    el.textContent = texto;
    el.className = 'msg ' + (ok ? 'ok' : 'erro');
  }

  // Busca nos seletores (moldura, avulso, entrada)
  document.getElementById('q-moldura-busca').addEventListener('input', function () {
    var molduras = PRODUTOS.filter(function (p) { return p.categoria === 'moldura'; });
    document.getElementById('q-moldura').innerHTML = opcoes(filtrar(molduras, this.value), '— escolha —');
  });
  document.getElementById('a-produto-busca').addEventListener('input', function () {
    document.getElementById('a-produto').innerHTML = opcoes(filtrar(PRODUTOS, this.value), '— escolha —');
  });
  document.getElementById('s-moldura-busca').addEventListener('input', function () {
    var molduras = PRODUTOS.filter(function (p) { return p.categoria === 'moldura'; });
    document.getElementById('s-moldura').innerHTML = opcoes(filtrar(molduras, this.value), '— escolha —');
  });
  document.getElementById('e-produto-busca').addEventListener('input', function () {
    document.getElementById('e-produto').innerHTML = opcoes(filtrar(PRODUTOS, this.value), '— escolha —');
  });

  // Registrar entrada de mercadoria
  document.getElementById('form-entrada').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true; mostrarMsg('Registrando…', true, 'entrada-msg');
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        mostrarMsg('Entrada registrada ✅ — ' + r.item + ': +' + r.quantidade + r.unidade +
                   ' (saldo ' + r.novo_saldo + r.unidade + ').', true, 'entrada-msg');
        document.getElementById('form-entrada').reset();
        carregarDashboard(); carregarProdutos();
      })
      .withFailureHandler(function (err) { btn.disabled = false; mostrarMsg('Não deu: ' + (err && err.message), false, 'entrada-msg'); })
      .registrarEntrada({
        token: TOKEN,
        codigo: document.getElementById('e-produto').value,
        quantidade: document.getElementById('e-qtd').value,
        observacoes: document.getElementById('e-obs').value
      });
  });

  // ---- Consulta ----
  function renderConsulta(query) {
    var itens = filtrar(PRODUTOS, query);
    var el = document.getElementById('c-resultado');
    if (!itens.length) { el.innerHTML = '<p class="vazio">Nada encontrado.</p>'; return; }
    el.innerHTML = '<table><thead><tr><th>Produto</th><th>Cód.</th><th>Categoria</th><th>Estoque</th><th>Preço</th></tr></thead><tbody>' +
      itens.map(function (p) {
        var aviso = (p.disponivel && p.estoque > 0) ? '' : ' <span class="pill baixo">indisp.</span>';
        return '<tr><td>' + escapar(p.nome) + (p.marca ? ' · ' + escapar(p.marca) : '') + aviso +
          '</td><td>' + escapar(p.codigo) + '</td><td>' + escapar(p.categoria) +
          '</td><td>' + p.estoque + p.unidade + '</td><td>' + brl(p.preco) + '/' + p.unidade + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  document.getElementById('c-busca').addEventListener('input', function () { renderConsulta(this.value); });

  // ---- Simulador de viabilidade ----
  function metros(v) {
    return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + ' m';
  }

  document.getElementById('form-simulador').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
    mostrarMsg('Simulando…', true, 'simulador-msg');
    document.getElementById('s-resultado').innerHTML = '';
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        var msg = document.getElementById('simulador-msg'); msg.textContent = ''; msg.className = 'msg';
        renderSimulacao(r);
      })
      .withFailureHandler(function (err) { btn.disabled = false; mostrarMsg('Não deu: ' + (err && err.message), false, 'simulador-msg'); })
      .simularServico(
        document.getElementById('s-moldura').value,
        document.getElementById('s-qtd').value,
        document.getElementById('s-largura').value,
        document.getElementById('s-altura').value
      );
  });

  // Alterna os modos do simulador (Do catálogo / Manual) por classe — não usa [hidden].
  document.getElementById('sim-modo').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button'); if (!btn) return;
    var alvo = btn.dataset.modo;
    this.querySelectorAll('button').forEach(function (b) { b.classList.toggle('ativo', b === btn); });
    document.querySelectorAll('#simulador .modo').forEach(function (m) {
      m.classList.toggle('ativo', m.dataset.modo === alvo);
    });
    document.getElementById('s-resultado').innerHTML = '';
    var msg = document.getElementById('simulador-msg'); msg.textContent = ''; msg.className = 'msg';
  });

  // Modo manual: perfil + estoque digitados (moldura fora do sistema).
  document.getElementById('form-simulador-manual').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
    mostrarMsg('Simulando…', true, 'simulador-msg');
    document.getElementById('s-resultado').innerHTML = '';
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        var msg = document.getElementById('simulador-msg'); msg.textContent = ''; msg.className = 'msg';
        renderSimulacao(r);
      })
      .withFailureHandler(function (err) { btn.disabled = false; mostrarMsg('Não deu: ' + (err && err.message), false, 'simulador-msg'); })
      .simularServicoManual(
        document.getElementById('sm-perfil').value,
        document.getElementById('sm-qtd').value,
        document.getElementById('sm-largura').value,
        document.getElementById('sm-altura').value,
        document.getElementById('sm-varas').value,
        document.getElementById('sm-pedaco').value,
        document.getElementById('sm-naodesenc').checked
      );
  });

  function renderSimulacao(r) {
    if (!r) { document.getElementById('s-resultado').innerHTML = '<p class="vazio">Não consegui simular.</p>'; return; }
    var titulo = r.da
      ? '<div class="veredito ok">✅ Dá pra fazer os ' + r.quantidade + ' quadros</div>'
      : '<div class="veredito nao">❌ Não dá — faltam ' + metros(r.falta_m) +
        (r.varas_comprar ? ' (≈ ' + r.varas_comprar + ' vara' + (r.varas_comprar > 1 ? 's' : '') + ' de 2,70 m)' : '') + '</div>';
    var identificacao = r.manual
      ? 'perfil ' + r.perfil_cm + ' cm (manual)'
      : escapar(r.nome) + ' (' + escapar(r.codigo) + ')';
    var linhas = [
      ['Moldura', identificacao],
      ['Consumo por quadro', metros(r.consumo_unitario_m)],
      ['Necessário', metros(r.necessario_m) + ' (' + r.varas_necessarias + ' varas de 2,70 m)'],
      [r.manual ? 'Disponível' : 'Em estoque', metros(r.estoque_m)],
      [r.da ? 'Sobra' : 'Falta', r.da ? metros(r.sobra_m) : metros(r.falta_m)],
      ['Máx. desse tamanho agora', r.max_quadros + ' quadros']
    ];
    var tab = '<table><tbody>' + linhas.map(function (l) {
      return '<tr><th>' + l[0] + '</th><td>' + l[1] + '</td></tr>';
    }).join('') + '</tbody></table>';
    var aviso = r.sem_perfil
      ? '<p class="vazio">⚠️ Sem a largura do perfil, o consumo foi estimado só pelo perímetro (não conta os cantos de 45°). ' +
        (r.manual ? 'Preencha o perfil.' : 'Cadastre o perfil da moldura.') + '</p>'
      : '';
    document.getElementById('s-resultado').innerHTML = titulo + tab + aviso;
  }

  // ---- Venda quadro/espelho ----
  function argsQuadro() {
    return {
      token: TOKEN,
      moldura: document.getElementById('q-moldura').value || undefined,
      vidro: document.getElementById('q-vidro').value || undefined,
      chapa: document.getElementById('q-chapa').value || undefined,
      espelho: document.getElementById('q-espelho').value || undefined,
      largura: document.getElementById('q-largura').value,
      altura: document.getElementById('q-altura').value,
      cliente: document.getElementById('q-cliente').value,
      observacoes: document.getElementById('q-obs').value,
      valorTotal: document.getElementById('q-total').value || undefined
    };
  }

  document.getElementById('q-calcular').addEventListener('click', function () {
    var prev = document.getElementById('q-preview');
    prev.className = 'preview mostrar'; prev.textContent = 'Calculando…';
    google.script.run
      .withSuccessHandler(function (orc) {
        var linhas = orc.itens.map(function (i) {
          return '• ' + i.item + ': ' + brl(i.valor) + '  (' + i.calculo + ')';
        }).join('\n');
        prev.textContent = linhas + '\n\nTotal calculado: ' + brl(orc.valor_total);
        document.getElementById('q-total').value = orc.valor_total;
      })
      .withFailureHandler(function (err) { prev.textContent = 'Erro: ' + (err && err.message); })
      .orcamentoPorCodigos(argsQuadro());
  });

  document.getElementById('form-quadro').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true; mostrarMsg('Registrando…', true, 'venda-quadro-msg');
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        mostrarMsg('Venda registrada ✅ — total ' + brl(r.valor_cobrado) +
                   (r.ajustado ? ' (valor ajustado)' : '') + ', estoque baixado.', true, 'venda-quadro-msg');
        document.getElementById('form-quadro').reset();
        document.getElementById('q-preview').className = 'preview';
        carregarDashboard(); carregarProdutos();
      })
      .withFailureHandler(function (err) { btn.disabled = false; mostrarMsg('Não deu: ' + (err && err.message), false, 'venda-quadro-msg'); })
      .registrarVendaQuadro(argsQuadro());
  });

  // ---- Venda avulsa ----
  document.getElementById('form-avulso').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true; mostrarMsg('Registrando…', true, 'venda-avulso-msg');
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        mostrarMsg('Venda registrada ✅ — ' + r.item + ' ' + r.quantidade + r.unidade + ', ' + brl(r.valor) + '.', true, 'venda-avulso-msg');
        document.getElementById('form-avulso').reset();
        carregarDashboard(); carregarProdutos();
      })
      .withFailureHandler(function (err) { btn.disabled = false; mostrarMsg('Não deu: ' + (err && err.message), false, 'venda-avulso-msg'); })
      .registrarVendaAvulsa({
        token: TOKEN,
        codigo: document.getElementById('a-produto').value,
        quantidade: document.getElementById('a-qtd').value,
        cliente: document.getElementById('a-cliente').value,
        observacoes: document.getElementById('a-obs').value
      });
  });

  // ---- Produtos (cadastrar + editar) ----
  var CAMPOS_PRODUTO = {
    moldura: [
      { k: 'Nome', l: 'Nome', t: 'text', req: true },
      { k: 'Marca', l: 'Marca (fornecedor)', t: 'text' },
      { k: 'Estilo', l: 'Estilo', t: 'select', op: ['classica', 'moderna', 'rustica', 'minimalista'] },
      { k: 'Cor', l: 'Cor', t: 'select', op: ['dourado', 'prata', 'preto', 'branco', 'madeira', 'rose'] },
      { k: 'Acabamento', l: 'Acabamento', t: 'text' },
      { k: 'Largura_perfil_cm', l: 'Largura do perfil (cm)', t: 'number' },
      { k: 'Valor_por_metro', l: 'Valor por metro (R$)', t: 'number', req: true },
      { k: 'Custo_por_metro', l: 'Custo por metro (R$)', t: 'number' },
      { k: 'Estoque_atual_m', l: 'Estoque atual (m)', t: 'number' },
      { k: 'Estoque_minimo_m', l: 'Estoque mínimo (m)', t: 'number' },
      { k: 'Foto_URL', l: 'Foto (URL)', t: 'text' },
      { k: 'Descricao', l: 'Descrição', t: 'text' },
      { k: 'Tags', l: 'Tags (separadas por vírgula)', t: 'text' },
      { k: 'Disponivel', l: 'Disponível?', t: 'select', op: ['sim', 'nao'] }
    ],
    material: [
      { k: 'Nome', l: 'Nome', t: 'text', req: true },
      { k: 'Tipo', l: 'Tipo', t: 'text' },
      { k: 'Espessura_mm', l: 'Espessura (mm)', t: 'number' },
      { k: 'Valor_por_m2', l: 'Valor por m² (R$)', t: 'number', req: true },
      { k: 'Custo_por_m2', l: 'Custo por m² (R$)', t: 'number' },
      { k: 'Estoque_atual_m2', l: 'Estoque atual (m²)', t: 'number' },
      { k: 'Estoque_minimo_m2', l: 'Estoque mínimo (m²)', t: 'number' },
      { k: 'Descricao', l: 'Descrição', t: 'text' },
      { k: 'Disponivel', l: 'Disponível?', t: 'select', op: ['sim', 'nao'] }
    ]
  };

  function camposDaCategoria(cat) { return cat === 'moldura' ? CAMPOS_PRODUTO.moldura : CAMPOS_PRODUTO.material; }

  function escaparAttr(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function normalizarValor(k, v) {
    if (k === 'Disponivel') return (v === false || v === 'FALSE' || v === 'nao' || v === 0) ? 'nao' : 'sim';
    return v;
  }

  // Espelha estoqueManualM/desencabecoM (Calculo.gs): varas×2,70 + pedaço − desencabeço do pedaço
  // (se a ponta não foi aberta). Desencabeço = √2×perfil + kerf (2mm) — escala com o perfil.
  function metrosDeVaras(varas, pedaco, perfilCm, naoDesenc) {
    var v = Number(varas) || 0, ped = Number(pedaco) || 0, p = Number(perfilCm) || 0;
    var disp = v * 2.70 + ped;
    if (naoDesenc && ped > 0) disp -= (p > 0 ? Math.SQRT2 * p / 100 : 0) + 0.002;
    return Math.max(0, Number(disp.toFixed(3)));
  }

  // Widget de estoque inicial de moldura por varas (só no cadastrar). Vira Estoque_atual_m.
  function widgetEstoqueVaras() {
    return '<div class="estoque-varas" data-estoque-varas>' +
      '<span class="ev-titulo">Estoque inicial (por varas)</span>' +
      '<div class="lin2">' +
        '<label>Varas inteiras (2,70 m) <input data-ev="varas" type="number" min="0" step="1" value="0"></label>' +
        '<label>Pedaço solto (m) <input data-ev="pedaco" type="number" min="0" step="0.01" value="0"></label>' +
      '</div>' +
      '<label class="check"><input data-ev="naodesenc" type="checkbox"> Esse pedaço ainda não está desencabeçado (desconta a ponta)</label>' +
      '<span class="ev-preview" data-ev-preview>= 0,00 m em estoque</span>' +
    '</div>';
  }

  // Renderiza os campos da categoria num container. `valores` prefilla (edição); `excluir` esconde colunas.
  // modo='novo' + moldura: o estoque atual vira o widget de varas (entrada por varas).
  function renderCampos(containerId, categoria, valores, excluir, modo) {
    valores = valores || {}; excluir = excluir || [];
    document.getElementById(containerId).innerHTML = camposDaCategoria(categoria)
      .filter(function (f) { return excluir.indexOf(f.k) < 0; })
      .map(function (f) {
        if (modo === 'novo' && categoria === 'moldura' && f.k === 'Estoque_atual_m') {
          return widgetEstoqueVaras();
        }
        var v = normalizarValor(f.k, valores[f.k]);
        var input;
        if (f.t === 'select') {
          input = '<select data-k="' + f.k + '"><option value="">—</option>' +
            f.op.map(function (o) { return '<option value="' + o + '"' + (String(v) === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
        } else {
          var val = (v === undefined || v === null) ? '' : v;
          input = '<input data-k="' + f.k + '" type="' + f.t + '"' +
            (f.t === 'number' ? ' step="0.01" min="0"' : '') + (f.req ? ' required' : '') + ' value="' + escaparAttr(val) + '">';
        }
        return '<label>' + f.l + (f.req ? ' *' : '') + ' ' + input + '</label>';
      }).join('');
  }

  function coletarCampos(containerId) {
    var campos = {};
    document.querySelectorAll('#' + containerId + ' [data-k]').forEach(function (el) {
      campos[el.dataset.k] = (el.type === 'number' && el.value !== '') ? Number(el.value) : el.value;
    });
    var ev = document.querySelector('#' + containerId + ' [data-estoque-varas]');
    if (ev) {
      campos['Estoque_atual_m'] = metrosDeVaras(
        ev.querySelector('[data-ev=varas]').value,
        ev.querySelector('[data-ev=pedaco]').value,
        campos['Largura_perfil_cm'],
        ev.querySelector('[data-ev=naodesenc]').checked
      );
    }
    return campos;
  }

  // Preview do estoque por varas (cadastrar moldura) — recalcula ao mexer em varas/pedaço/perfil.
  function atualizarPreviewVaras() {

  // ---- Gráficos (Chart.js) e animações do painel ----
  var TEM_CHART = typeof Chart !== 'undefined'; // CDN pode falhar sem internet — degrada com aviso
  var GRAFICOS = {}; // instâncias vivas por chave; sempre destruir antes de redesenhar no mesmo lugar
  var REDUZIR_MOVIMENTO = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esqueletoKpis() {
    return '<div class="skel skel-kpi"></div><div class="skel skel-kpi"></div>' +
           '<div class="skel skel-kpi"></div><div class="skel skel-kpi"></div>';
  }
  function esqueletoLinhas(n) {
    var h = ''; for (var i = 0; i < n; i++) h += '<div class="skel skel-lin"></div>';
    return h;
  }
  // Contador animado: o número sobe até o valor final. fmt formata (padrão: R$).
  function contarAte(el, fim, fmt) {
    fim = Number(fim) || 0; fmt = fmt || brl;
    if (REDUZIR_MOVIMENTO || !window.requestAnimationFrame) { el.textContent = fmt(fim); return; }
    var dur = 700, t0 = null;
    function passo(t) {
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / dur, 1);
      p = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(fim * p);
      if (p < 1) requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  }
  function brlCompacto(v) {
    if (Math.abs(v) >= 1000) return 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  }
  function animChart() { return { duration: REDUZIR_MOVIMENTO ? 0 : 850, easing: 'easeOutQuart' }; }
  function tooltipBRL() {
    return {
      backgroundColor: '#13294b', titleColor: '#e6c869', bodyColor: '#fff',
      padding: 10, cornerRadius: 8, boxPadding: 4,
      callbacks: { label: function (c) { return (c.dataset.label ? c.dataset.label + ': ' : '') + brl(c.parsed.y); } }
    };
  }
  // Desenha (ou redesenha) um Chart.js dentro do container. config null -> estado vazio.
  function desenharChart(chave, elId, config, msgVazio) {
    var el = document.getElementById(elId);
    if (GRAFICOS[chave]) { GRAFICOS[chave].destroy(); delete GRAFICOS[chave]; }
    if (!config || !TEM_CHART) {
      el.innerHTML = '<div class="vazio-graf"><span class="ico">🖼️</span><span>' +
        escapar(!TEM_CHART ? 'Não deu pra carregar o gráfico (sem internet?).' : msgVazio) + '</span></div>';
      return;
    }
    el.innerHTML = '<canvas></canvas>';
    GRAFICOS[chave] = new Chart(el.firstChild.getContext('2d'), config);
  }

  // ---- Relatórios (bloco "Vendas pelo sistema") ----
  var RELATORIO_PERIODO = 'mes';

  document.getElementById('rel-periodos').addEventListener('click', function (ev) {

      })

  function renderRelatorios(d) {
    if (!d) { document.getElementById('rel-kpis').innerHTML = '<span class="vazio">Não consegui carregar.</span>'; return; }
    document.getElementById('rel-kpis').innerHTML =
      ['Faturamento', 'Vendas', 'Ticket médio', 'Lucro líquido'].map(function (r) {
        return '<div class="card"><div class="rotulo">' + r + '</div><div class="valor"></div><div class="extra"></div></div>';
      }).join('');
    var cards = document.querySelectorAll('#rel-kpis .card');
    contarAte(cards[0].querySelector('.valor'), d.faturamento);
    contarAte(cards[1].querySelector('.valor'), d.num_vendas || 0, function (v) { return String(Math.round(v)); });
    contarAte(cards[2].querySelector('.valor'), d.ticket_medio);
    var l = d.lucro || {};
    if (l.tem_custo) {
      contarAte(cards[3].querySelector('.valor'), l.valor);
      if (l.itens_sem_custo) cards[3].querySelector('.extra').innerHTML =
        '<span class="pill baixo">' + l.itens_sem_custo + ' s/ custo</span>';
    } else {
      cards[3].querySelector('.valor').innerHTML = '<span class="vazio">aguardando custos</span>';
    }

    // Campeãs de venda: pódio com posição + metros + valor
    var rk = d.ranking_molduras || [];
    document.getElementById('rel-ranking').innerHTML = rk.length
      ? rk.map(function (m, i) {
          return '<div class="rank-item" style="animation-delay:' + (i * 50) + 'ms">' +
            '<span class="rank-pos">' + (i + 1) + '</span>' +
            '<span class="rank-corpo"><span class="rank-nome">' + escapar(m.nome) + '</span>' +
            '<span class="rank-sub">' + m.metros + ' m vendidos</span></span>' +
            '<span class="rank-val">' + brl(m.valor) + '</span></div>';
        }).join('')
      : '<p class="vazio">Sem vendas de moldura no período.</p>';

    desenharGraficos(d);
  }

  function desenharGraficos(d) {
    // Faturamento no tempo: linha dourada com área preenchida (nada de pizza por aqui)
    var serie = d.serie_tempo || [];
    desenharChart('relTempo', 'rel-tempo', serie.length ? {
      type: 'line',
      data: {
        labels: serie.map(function (p) { return p.rotulo; }),
        datasets: [{
          label: 'Faturamento', data: serie.map(function (p) { return p.valor; }),
          borderColor: '#b8901f', borderWidth: 2.5, pointRadius: 3.5, pointHoverRadius: 6,
          pointBackgroundColor: '#13294b', pointBorderColor: '#b8901f', tension: .35, fill: true,
          backgroundColor: function (ctx) {
            var g = ctx.chart.ctx.createLinearGradient(0, 0, 0, ctx.chart.height);
            g.addColorStop(0, 'rgba(201,162,39,.30)'); g.addColorStop(1, 'rgba(201,162,39,0)');
            return g;
          }
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: animChart(),
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: tooltipBRL() },
        scales: {
          x: { grid: { display: false } },
          y: { border: { display: false }, grid: { color: '#eef0f4' },
               ticks: { callback: function (v) { return brlCompacto(v); }, maxTicksLimit: 6 } }
        }
      }
    } : null, 'Sem vendas no período.');

    // Por categoria: barras horizontais animadas (substitui a antiga pizza)
    var cat = d.por_categoria || [];
    var alvo = document.getElementById('rel-categoria');
    if (!cat.length) { alvo.innerHTML = '<p class="vazio">Sem vendas no período.</p>'; return; }
    var total = 0, maior = 0;
    cat.forEach(function (c) { total += c.valor; if (c.valor > maior) maior = c.valor; });
    alvo.innerHTML = cat.map(function (c, i) {
      var pct = total > 0 ? Math.round((c.valor / total) * 100) : 0;
      var larg = maior > 0 ? Math.max((c.valor / maior) * 100, 2) : 2;
      return '<div class="lb-item estatico' + (i === 0 ? ' ouro' : '') + '" style="animation-delay:' + (i * 55) + 'ms">' +
        '<span class="lb-topo"><span class="lb-nome">' + escapar(c.categoria) + '</span>' +
        '<span class="lb-val">' + brl(c.valor) + '</span></span>' +
        '<span class="lb-sub">' + pct + '% do faturamento · ' + c.quantidade + ' ' + escapar(c.unidade || '') + '</span>' +
        '<span class="lb-trilha"><span class="lb-bar" style="width:' + larg + '%; animation-delay:' + (i * 55 + 150) + 'ms"></span></span></div>';
    }).join('');
  }

  // ---- Financeiro (caderno digital: gastos + vendas + dashboard de fluxo de caixa) ----

  function carregarSaldos() {
    google.script.run
      .withSuccessHandler(function (s) {
        if (!s) return;
        contarAte(document.getElementById('saldo-conta'), s.conta_empresa);
        contarAte(document.getElementById('saldo-tesouro'), s.tesouro_direto);
        contarAte(document.getElementById('saldo-total'), s.total);
        document.getElementById('saldo-atualizado').textContent = s.atualizado_em ? ('atualizado ' + s.atualizado_em) : '';
        document.getElementById('saldo-conta-input').value = String(s.conta_empresa).replace('.', ',');
        document.getElementById('saldo-tesouro-input').value = String(s.tesouro_direto).replace('.', ',');
      })
      .withFailureHandler(function (err) { if (erroEhSessao(err)) return sairLocal(); })
      .lerSaldos(TOKEN);
  }

  document.getElementById('btn-editar-saldos').addEventListener('click', function () {
    document.getElementById('form-saldos').hidden = false;
  });
  document.getElementById('btn-cancelar-saldos').addEventListener('click', function () {
    document.getElementById('form-saldos').hidden = true;
  });
  document.getElementById('form-saldos').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
    mostrarMsg('Salvando…', true, 'saldos-msg');
    google.script.run
      .withSuccessHandler(function () {
        btn.disabled = false;
        document.getElementById('form-saldos').hidden = true;
        mostrarMsg('', true, 'saldos-msg');
        carregarSaldos();
      })
      .withFailureHandler(function (err) { btn.disabled = false; if (erroEhSessao(err)) return sairLocal(); mostrarMsg('Não deu: ' + (err && err.message), false, 'saldos-msg'); })
      .salvarSaldos({
        token: TOKEN,
        conta_empresa: document.getElementById('saldo-conta-input').value,
        tesouro_direto: document.getElementById('saldo-tesouro-input').value
      });
  });

  function renderFinanceiro(d) {
    if (!d) { document.getElementById('fin-kpis').innerHTML = '<span class="vazio">Não consegui carregar.</span>'; return; }
    FIN_ULTIMO = d;
    LANC_TODOS = false;

    var selMes = document.getElementById('fin-mes');
    selMes.innerHTML = optSimples([{ valor: '', rotulo: 'Acumulado (todos os meses)' }].concat(d.meses || []), null);
    selMes.value = d.mes_sel || '';

    // KPIs com contador animado + variação vs mês anterior; a margem ganha um medidor 0–100%
    var p = d.periodo || {};
    var vv = d.variacao || { tem: false };
    function delta(pct, ruimSeSobe) {
      if (!vv.tem || pct == null) return '';
      var igual = pct === 0, sobe = pct > 0;
      var bom = igual ? false : ((sobe && !ruimSeSobe) || (!sobe && ruimSeSobe));
      var cls = igual ? 'igual' : (bom ? 'bom' : 'ruim');
      var seta = igual ? '→' : (sobe ? '▲' : '▼');
      return '<div class="delta-pill ' + cls + '">' + seta + ' ' + Math.abs(pct) + '% vs ' + escapar(vv.mes_anterior) + '</div>';
    }
    var elK = document.getElementById('fin-kpis');
    elK.innerHTML = [
      ['Entrada', delta(vv.entrada, false)],
      ['Saída', delta(vv.saida, true)],
      ['Saldo', delta(vv.saldo, false)],
      ['Margem', '<div class="medidor"><i style="width:' + Math.max(0, Math.min(100, p.margem || 0)) + '%"></i></div>']
    ].map(function (c) {
      return '<div class="card"><div class="rotulo">' + c[0] + '</div><div class="valor"></div>' + c[1] + '</div>';
    }).join('');
    var vals = elK.querySelectorAll('.valor');
    contarAte(vals[0], p.entrada);
    contarAte(vals[1], p.saida);
    contarAte(vals[2], p.saldo);
    contarAte(vals[3], p.margem || 0, function (v) { return (Math.round(v * 10) / 10).toLocaleString('pt-BR') + '%'; });

    // Leitura rápida: os insights viram cartões escaneáveis (com o racha loja × pessoal)
    var ac = d.acumulado || {};
    var chips = [
      { ico: '💰', html: 'Saldo acumulado de <strong>' + brl(ac.saldo) + '</strong> — entrou ' + brl(ac.entrada) + ', saiu ' + brl(ac.saida) + '.' }
    ];
    if (d.melhor_mes) chips.push({ ico: '🏆', html: 'Melhor mês até agora: <strong>' + escapar(d.melhor_mes.rotulo) + '</strong>, com saldo de ' + brl(d.melhor_mes.saldo) + '.' });
    if (d.maior_categoria_acumulada) chips.push({ ico: '📌', html: 'Maior gasto: <strong>' + escapar(d.maior_categoria_acumulada.categoria) + '</strong> — ' + brl(d.maior_categoria_acumulada.valor) + ' (' + d.maior_categoria_acumulada.pct + '% das saídas).' });
    chips.push({ ico: '📈', html: 'Margem acumulada de <strong>' + (ac.margem || 0) + '%</strong> — quanto sobra de cada real que entra.' });
    var st = d.saidas_por_tipo || {};
    if ((st.loja || 0) + (st.pessoal || 0) > 0) {
      var totTipo = st.loja + st.pessoal;
      var pctLoja = Math.round((st.loja / totTipo) * 100);
      chips.push({ ico: '🏪', html: 'Saídas: loja <strong>' + brl(st.loja) + '</strong> · pessoal <strong>' + brl(st.pessoal) + '</strong>' +
        '<span class="mini-split"><i class="de-loja" style="width:' + pctLoja + '%"></i><i class="de-pessoal" style="width:' + (100 - pctLoja) + '%"></i></span>' +
        '<span class="mini-leg"><span><span class="leg-ponto" style="background:var(--navy)"></span>Loja ' + pctLoja + '%</span>' +
        '<span><span class="leg-ponto" style="background:var(--gold)"></span>Pessoal ' + (100 - pctLoja) + '%</span></span>' });
    }
    document.getElementById('fin-insights').innerHTML = chips.map(function (c) {
      return '<div class="chip-insight"><span class="ico">' + c.ico + '</span><span class="txt">' + c.html + '</span></div>';
    }).join('');

    atualizarCategoriaUI();
    desenharFinanceiro(d);
  }

  // Partes que dependem do filtro de categoria — resolvem local, sem nova chamada ao servidor.
  function atualizarCategoriaUI() {
    var d = FIN_ULTIMO; if (!d) return;
    var cats = d.saidas_por_categoria || [];

    // faixa de destaque quando uma categoria está filtrada
    var sel = null;
    cats.forEach(function (c) { if (c.categoria === FIN_CAT) sel = c; });
    document.getElementById('fin-cat-destaque').innerHTML = (FIN_CAT && sel)
      ? '<div class="destaque-cat"><span>📌</span><span>Vendo só <strong>' + escapar(sel.categoria) + '</strong>: ' +
        brl(sel.valor) + ' · ' + sel.pct + '% das saídas do período</span>' +
        '<button type="button" class="fechar" id="btn-limpar-cat" title="Limpar filtro">✕</button></div>'
      : '';
    var btnLimpar = document.getElementById('btn-limpar-cat');
    if (btnLimpar) btnLimpar.addEventListener('click', function () { aplicarFiltroCategoria(''); });

    // barras por categoria (no lugar da antiga pizza) — a maior fica dourada
    var maior = 0;
    cats.forEach(function (c) { if (c.valor > maior) maior = c.valor; });
    document.getElementById('fin-categorias').innerHTML = cats.length
      ? cats.map(function (c, i) {
          var larg = maior > 0 ? Math.max((c.valor / maior) * 100, 2) : 2;
          return '<button type="button" class="lb-item' + (i === 0 ? ' ouro' : '') +
            (c.categoria === FIN_CAT ? ' ativo' : '') + '" data-cat="' + escaparAttr(c.categoria) +
            '" style="animation-delay:' + (i * 45) + 'ms">' +
            '<span class="lb-topo"><span class="lb-nome">' + escapar(c.categoria) + '</span>' +
            '<span class="lb-val">' + brl(c.valor) + '</span></span>' +
            '<span class="lb-sub">' + c.pct + '% das saídas</span>' +
            '<span class="lb-trilha"><span class="lb-bar" style="width:' + larg + '%; animation-delay:' + (i * 45 + 120) + 'ms"></span></span></button>';
        }).join('')
      : '<p class="vazio">Sem saídas no período.</p>';

    renderLancamentos();
  }

  // Extrato: ícone de entrada/saída, badge "pessoal" e corte em 12 linhas com "mostrar todos".
  function renderLancamentos() {
    var d = FIN_ULTIMO; if (!d) return;
    var alvo = document.getElementById('fin-lancamentos');
    var lanc = (d.lancamentos || []).filter(function (l) { return !FIN_CAT || l.categoria === FIN_CAT; });
    if (!lanc.length) {
      alvo.innerHTML = '<p class="vazio">' + (FIN_CAT ? 'Sem lançamentos dessa categoria no período.' : 'Sem lançamentos no período.') + '</p>';
      return;
    }
    var LIMITE = 12;
    var corte = (!LANC_TODOS && lanc.length > LIMITE) ? lanc.slice(0, LIMITE) : lanc;
    alvo.innerHTML = '<table class="tab-lanc"><thead><tr><th></th><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead><tbody>' +
      corte.map(function (l, i) {
        var ent = l.tipo === 'entrada';
        return '<tr style="animation-delay:' + (Math.min(i, 10) * 30) + 'ms">' +
          '<td><span class="lanc-tipo ' + (ent ? 'ent' : 'sai') + '">' + (ent ? '↑' : '↓') + '</span></td>' +
          '<td>' + escapar(l.data) + '</td>' +
          '<td>' + escapar(l.descricao) + (l.escopo === 'pessoal' ? '<span class="badge-escopo">pessoal</span>' : '') + '</td>' +
          '<td>' + escapar(l.categoria) + '</td>' +
          '<td class="' + (ent ? 'lanc-ent' : 'lanc-sai') + '">' + (ent ? '+ ' : '− ') + brl(l.valor) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      ((!LANC_TODOS && lanc.length > LIMITE)
        ? '<button type="button" class="btn-mais" id="btn-lanc-todos">Mostrar todos os ' + lanc.length + ' lançamentos</button>' : '');
    var btn = document.getElementById('btn-lanc-todos');
    if (btn) btn.addEventListener('click', function () { LANC_TODOS = true; renderLancamentos(); });
  }

  // Fluxo mês a mês: barras entrada/saída + linha dourada do saldo acumulado. Clique filtra o mês.
  function desenharFinanceiro(d) {
    var pm = d.por_mes || [];
    function corBarra(cor) {
      return function (ctx) {
        if (!FIN_MES) return cor;
        var m = pm[ctx.dataIndex];
        return (m && m.mes === FIN_MES) ? cor : (cor + '55'); // fora do mês escolhido: esmaece
      };
    }
    desenharChart('finFluxo', 'fin-fluxo', pm.length ? {
      data: {
        labels: pm.map(function (m) { return m.rotulo; }),
        datasets: [
          { type: 'line', label: 'Saldo acumulado', data: pm.map(function (m) { return m.saldo_acumulado; }),
            borderColor: '#b8901f', borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 6,
            pointBackgroundColor: '#13294b', pointBorderColor: '#b8901f', tension: .3, order: 0 },
          { type: 'bar', label: 'Entrada', data: pm.map(function (m) { return m.entrada; }),
            backgroundColor: corBarra('#059669'), borderRadius: 6, order: 1 },
          { type: 'bar', label: 'Saída', data: pm.map(function (m) { return m.saida; }),
            backgroundColor: corBarra('#dc2626'), borderRadius: 6, order: 2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: animChart(),
        interaction: { mode: 'index', intersect: false },
        onClick: function (ev, els) {
          if (!els || !els.length) return;
          var m = pm[els[0].index]; if (!m) return;
          FIN_MES = (FIN_MES === m.mes) ? '' : m.mes; // clicar de novo volta pro acumulado
          carregarFinanceiro();
        },
        onHover: function (ev, els, chart) { chart.canvas.style.cursor = els.length ? 'pointer' : 'default'; },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 14 } },
          tooltip: tooltipBRL()
        },
        scales: {
          x: { grid: { display: false } },
          y: { border: { display: false }, grid: { color: '#eef0f4' },
               ticks: { callback: function (v) { return brlCompacto(v); }, maxTicksLimit: 6 } }
        }
      }
    } : null, 'Sem lançamentos ainda.');
  }

  // ====================== Oficina ======================
  var ULTIMA_OFICINA = { producao: [], prontos: [] }; // última lista carregada, p/ prefill da edição
  function recarregarOficina(modo) { if (modo === 'prontos') carregarOficinaProntos(); else carregarOficinaProducao(); }
  function ofMsgId(modo) { return modo === 'prontos' ? 'of-prontos-msg' : 'of-producao-msg'; }
  function prazoParaISO(s) { var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? (m[3] + '-' + m[2] + '-' + m[1]) : ''; }
  function escAttr(s) { return escapar(s).replace(/"/g, '&quot;'); }

  function carregarOficinaProducao() {
    document.getElementById('of-producao-lista').innerHTML = '<span class="carregando">Carregando…</span>';
    google.script.run
      .withSuccessHandler(function (lista) { renderOrdens(lista, 'of-producao-lista', 'producao'); })
      .withFailureHandler(function (err) { erroOficinaLista(err, 'of-producao-lista'); })
      .listarOrdens(TOKEN, 'em_producao,acabamento');
  }
  function carregarOficinaProntos() {
    document.getElementById('of-prontos-lista').innerHTML = '<span class="carregando">Carregando…</span>';
    google.script.run
      .withSuccessHandler(function (lista) { renderOrdens(lista, 'of-prontos-lista', 'prontos'); })
      .withFailureHandler(function (err) { erroOficinaLista(err, 'of-prontos-lista'); })
      .listarOrdens(TOKEN, 'pronto');
  }
  function erroOficinaLista(err, elId) {
    if (erroEhSessao(err)) { sairLocal(); return; }
    document.getElementById(elId).innerHTML =
      '<p class="vazio">' + escapar((err && err.message) || 'Não consegui carregar.') + '</p>';
  }
  function renderOrdens(lista, elId, modo) {
    ULTIMA_OFICINA[modo] = lista || [];
    var alvo = document.getElementById(elId);
    if (!lista || !lista.length) { alvo.innerHTML = '<p class="vazio">Nenhuma ordem aqui.</p>'; return; }
    var podeEditar = temGestaoJS(PAPEIS);
    alvo.innerHTML = lista.map(function (o) {
      var p = [];
      p.push('<div class="of-cab"><strong>' + escapar(o.cliente || '(sem nome)') +
             '</strong><span class="of-id">' + escapar(o.id) + '</span></div>');
      if (o.status === 'acabamento') p.push('<div class="of-badges">' + badgeStatus(o.status) + '</div>');
      if (o.descricao) p.push('<div class="of-desc">' + escapar(o.descricao) + '</div>');
      var meta = [];
      if (o.prazo) meta.push('prazo: ' + escapar(o.prazo));
      if (o.valor) meta.push(brl(o.valor));
      if (o.telefone) meta.push('📱 ' + escapar(o.telefone));
      if (meta.length) p.push('<div class="of-meta">' + meta.join(' · ') + '</div>');
      if (modo === 'prontos') {
        var av = o.aviso === 'enviado' ? ('✅ cliente avisado ' + escapar(o.data_aviso))
               : o.aviso === 'falha' ? '⚠️ aviso falhou — avise manualmente'
               : '⏳ aviso pendente';
        p.push('<div class="of-aviso">' + av + '</div>');
      }
      var acoes = [];
      if (podeEditar) acoes.push('<button class="of-btn of-btn-sec" data-acao="editar" data-id="' + escapar(o.id) + '">Editar</button>');
      if (modo === 'prontos') acoes.push('<button class="of-btn" data-acao="entregue" data-id="' + escapar(o.id) + '">Marcar entregue</button>');
      else if (o.status === 'acabamento') acoes.push('<button class="of-btn" data-acao="pronto" data-id="' + escapar(o.id) + '">Marcar pronto</button>');
      else acoes.push('<button class="of-btn" data-acao="acabamento" data-id="' + escapar(o.id) + '">Falta acabamento</button>');
      p.push('<div class="of-acoes">' + acoes.join('') + '</div>');
      return '<div class="of-item">' + p.join('') + '</div>';
    }).join('');
  }
  // Form de edição renderizado DENTRO do card (prefill via ULTIMA_OFICINA).
  function formEdicaoOrdem(o) {
    return '<div class="of-cab"><strong>Editando</strong><span class="of-id">' + escapar(o.id) + '</span></div>' +
      '<label class="of-ed-l">Cliente<input class="of-ed" data-k="cliente" value="' + escAttr(o.cliente) + '"></label>' +
      '<label class="of-ed-l">WhatsApp (com DDD)<input class="of-ed" data-k="telefone" value="' + escAttr(o.telefone) + '"></label>' +
      '<label class="of-ed-l">Descrição<textarea class="of-ed" data-k="descricao" rows="3">' + escapar(o.descricao) + '</textarea></label>' +
      '<label class="of-ed-l">Prazo<input class="of-ed" data-k="prazo" type="date" value="' + prazoParaISO(o.prazo) + '"></label>' +
      '<label class="of-ed-l">Valor (R$)<input class="of-ed" data-k="valor" type="number" min="0" step="0.01" value="' + (Number(o.valor) || 0) + '"></label>' +
      '<div class="of-acoes">' +
        '<button class="of-btn" data-acao="salvar-edicao" data-id="' + escapar(o.id) + '">Salvar</button>' +
        '<button class="of-btn of-btn-sec" data-acao="cancelar-edicao" data-id="' + escapar(o.id) + '">Cancelar</button>' +
      '</div>';
  }
  function onOficinaAcao(ev) {
    var btn = ev.target.closest('button[data-acao]'); if (!btn) return;
    var id = btn.dataset.id, acao = btn.dataset.acao;
    var modo = ev.currentTarget.id === 'of-prontos-lista' ? 'prontos' : 'producao';
    var msgId = ofMsgId(modo);

    if (acao === 'editar') {
      var o = (ULTIMA_OFICINA[modo] || []).filter(function (x) { return x.id === id; })[0];
      if (o) btn.closest('.of-item').innerHTML = formEdicaoOrdem(o);
      return;
    }
    if (acao === 'cancelar-edicao') { recarregarOficina(modo); return; }
    if (acao === 'salvar-edicao') {
      var card = btn.closest('.of-item');
      var dados = { token: TOKEN, id: id };
      card.querySelectorAll('.of-ed').forEach(function (el) { dados[el.dataset.k] = el.value; });
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function () { mostrarMsg('Ordem ' + id + ' atualizada! ✏️', true, msgId); recarregarOficina(modo); })
        .withFailureHandler(function (err) { btn.disabled = false; if (erroEhSessao(err)) return sairLocal(); mostrarMsg((err && err.message) || 'Erro ao salvar.', false, msgId); })
        .editarOrdem(dados);
      return;
    }

    btn.disabled = true;
    if (acao === 'acabamento') {
      google.script.run
        .withSuccessHandler(function () { mostrarMsg('Ordem ' + id + ' foi pro acabamento.', true, 'of-producao-msg'); carregarOficinaProducao(); })
        .withFailureHandler(function (err) { btn.disabled = false; if (erroEhSessao(err)) return sairLocal(); mostrarMsg((err && err.message) || 'Deu erro.', false, 'of-producao-msg'); })
        .marcarAcabamento({ token: TOKEN, id: id });
    } else if (acao === 'pronto') {
      google.script.run
        .withSuccessHandler(function () { mostrarMsg('Pronto! A Julia vai avisar o cliente. 💬', true, 'of-producao-msg'); carregarOficinaProducao(); })
        .withFailureHandler(function (err) { btn.disabled = false; if (erroEhSessao(err)) return sairLocal(); mostrarMsg((err && err.message) || 'Deu erro.', false, 'of-producao-msg'); })
        .marcarPronto({ token: TOKEN, id: id });
    } else if (acao === 'entregue') {
      google.script.run
        .withSuccessHandler(function () { mostrarMsg('Entregue! Valor lançado no financeiro. ✅', true, 'of-prontos-msg'); carregarOficinaProntos(); })
        .withFailureHandler(function (err) { btn.disabled = false; if (erroEhSessao(err)) return sairLocal(); mostrarMsg((err && err.message) || 'Deu erro.', false, 'of-prontos-msg'); })
        .marcarEntregue({ token: TOKEN, id: id });
    }
  }
  document.getElementById('of-producao-lista').addEventListener('click', onOficinaAcao);
  document.getElementById('of-prontos-lista').addEventListener('click', onOficinaAcao);

  // ---- Histórico de serviços (filtro mês/ano, por data de criação) ----
  var HISTORICO_OFICINA = [];
  var MESES_OF = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                  'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  function mesAnoDe(o) {
    var m = String(o.data_criacao || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? { mes: parseInt(m[2], 10), ano: parseInt(m[3], 10) } : null;
  }
  function badgeStatus(s) {
    var rotulo = s === 'entregue' ? 'Entregue' : s === 'pronto' ? 'Pronto' : s === 'acabamento' ? 'Falta acabamento' : 'Em produção';
    return '<span class="of-badge of-badge-' + (s || 'em_producao') + '">' + rotulo + '</span>';
  }
  function carregarOficinaHistorico() {
    document.getElementById('of-hist-lista').innerHTML = '<span class="carregando">Carregando…</span>';
    google.script.run
      .withSuccessHandler(function (lista) { HISTORICO_OFICINA = lista || []; prepararFiltrosHistorico(); renderHistorico(); })
      .withFailureHandler(function (err) { erroOficinaLista(err, 'of-hist-lista'); })
      .listarOrdens(TOKEN, '');
  }
  function prepararFiltrosHistorico() {
    var selMes = document.getElementById('of-hist-mes');
    if (!selMes.options.length) {
      var om = ['<option value="">Todos os meses</option>'];
      for (var i = 1; i <= 12; i++) om.push('<option value="' + i + '">' + MESES_OF[i - 1] + '</option>');
      selMes.innerHTML = om.join('');
    }
    var selAno = document.getElementById('of-hist-ano');
    var anos = {};
    HISTORICO_OFICINA.forEach(function (o) { var ma = mesAnoDe(o); if (ma) anos[ma.ano] = true; });
    var lista = Object.keys(anos).sort(function (a, b) { return b - a; });
    var atual = selAno.value;
    var oa = ['<option value="">Todos os anos</option>'];
    lista.forEach(function (a) { oa.push('<option value="' + a + '">' + a + '</option>'); });
    selAno.innerHTML = oa.join('');
    if (atual) selAno.value = atual;
  }
  function renderHistorico() {
    var mes = document.getElementById('of-hist-mes').value;
    var ano = document.getElementById('of-hist-ano').value;
    var filtradas = HISTORICO_OFICINA.filter(function (o) {
      var ma = mesAnoDe(o);
      if (!ma) return !mes && !ano; // sem data: só aparece em "todos"
      if (mes && ma.mes !== parseInt(mes, 10)) return false;
      if (ano && ma.ano !== parseInt(ano, 10)) return false;
      return true;
    });
    var total = filtradas.reduce(function (s, o) { return s + (Number(o.valor) || 0); }, 0);
    document.getElementById('of-hist-resumo').innerHTML =
      filtradas.length ? ('<strong>' + filtradas.length + '</strong> serviço(s) · total ' + brl(total)) : '';
    var alvo = document.getElementById('of-hist-lista');
    if (!filtradas.length) { alvo.innerHTML = '<p class="vazio">Nenhum serviço nesse período.</p>'; return; }
    alvo.innerHTML = filtradas.map(function (o) {
      var p = [];
      p.push('<div class="of-cab"><strong>' + escapar(o.cliente || '(sem nome)') +
             '</strong><span class="of-id">' + escapar(o.id) + '</span></div>');
      p.push('<div class="of-badges">' + badgeStatus(o.status) + '</div>');
      if (o.descricao) p.push('<div class="of-desc">' + escapar(o.descricao) + '</div>');
      var meta = [];
      if (o.valor) meta.push(brl(o.valor));
      if (o.data_criacao) meta.push('criado: ' + escapar(o.data_criacao));
      if (o.data_entrega) meta.push('entregue: ' + escapar(o.data_entrega));
      if (o.telefone) meta.push('📱 ' + escapar(o.telefone));
      if (meta.length) p.push('<div class="of-meta">' + meta.join(' · ') + '</div>');
      return '<div class="of-item">' + p.join('') + '</div>';
    }).join('');
  }
  document.getElementById('of-hist-mes').addEventListener('change', renderHistorico);
  document.getElementById('of-hist-ano').addEventListener('change', renderHistorico);

  document.getElementById('form-of-nova').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
    var form = this;
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        mostrarMsg('Ordem ' + (r && r.id) + ' criada! 🎉', true, 'of-nova-msg');
        form.reset();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        if (erroEhSessao(err)) return sairLocal();
        mostrarMsg((err && err.message) || 'Não consegui criar a ordem.', false, 'of-nova-msg');
      })
      .criarOrdem({
        token: TOKEN,
        cliente: document.getElementById('of-cliente').value,
        telefone: document.getElementById('of-telefone').value,
        descricao: document.getElementById('of-descricao').value,
        prazo: document.getElementById('of-prazo').value,
        valor: document.getElementById('of-valor').value
      });
  });

  // Bootstrap: tem token salvo? confere no servidor; senão, mostra o login.
  if (TOKEN) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) {
          if (r.papeis) { PAPEIS = r.papeis; localStorage.setItem('vera_papeis', PAPEIS.join(',')); }
          entrarNoApp();
        } else { sairLocal(); }
      })
      .withFailureHandler(function () { sairLocal(); })
      .verificarSessao(TOKEN);
  } else {
    mostrarLogin();
  }
</script>
